<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Органайзер</title>
<link rel="dns-prefetch" href="https://telegram.org">
<link rel="preconnect" href="https://telegram.org" crossorigin>
<script>
  // Clean up any stale Service Workers from previous projects on this port
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      for (var r of regs) r.unregister();
    });
  }
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="glass.css?v=2.0.7">
<link rel="stylesheet" href="app.css?v=2.0.7">
</head>
<body>

<!-- ══ PIN lock ══ -->
<div class="lock" id="lock">
  <div style="font-size:17px;font-weight:600">Введите PIN-код</div>
  <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
  <div class="pin-pad" id="pinPad"></div>
</div>

<!-- ══ HOME ══ -->
<main class="page active" id="page-home">
  <div class="h1">Органайзер</div>
  <div class="search glass">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInp" type="search" placeholder="Поиск по всему" autocomplete="off">
  </div>
  <div id="searchResults"></div>
  <div id="homeMain">
    <div class="grid" id="sections"></div>
    <div class="h2">Календарь</div>
    <div class="card glass cal" id="calendar"></div>
    <div id="dayItems"></div>
  </div>
  <!-- section drill-down -->
  <div id="sectionView" style="display:none"></div>
</main>

<!-- ══ PROFILE ══ -->
<main class="page" id="page-profile">
  <div class="h1">Профиль</div>
  <div class="card glass" id="profileCard" style="display:flex;align-items:center;gap:12px"></div>
  <div class="h2">Статистика</div>
  <div class="stat-grid" id="stats"></div>
</main>

<!-- ══ SETTINGS ══ -->
<main class="page" id="page-settings">
  <div class="h1">Настройки</div>
  <div class="h2">Безопасность</div>
  <div class="card glass set-group" id="setSecurity"></div>
  <div class="h2">Бот</div>
  <div class="card glass set-group" id="setBot"></div>
  <div class="h2">Данные</div>
  <div class="card glass set-group" id="setData"></div>
</main>

<!-- ══ Bottom nav — floating glass pill ══ -->
<nav class="nav glass" id="nav">
  <div class="nav-pill glass-indicator" id="navPill"></div>
  <button class="nav-item active" data-page="home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Главная</span>
  </button>
  <button class="nav-item" data-page="profile">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    <span>Профиль</span>
  </button>
  <button class="nav-item" data-page="settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
    <span>Настройки</span>
  </button>
</nav>

<!-- ══ FAB ══ -->
<button class="fab glass" id="fab" aria-label="Добавить">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- ══ Create/edit sheet ══ -->
<div class="sheet-back" id="sheetBack"></div>
<div class="sheet" id="sheet"></div>

<!-- ══ Toast & File input ══ -->
<div class="toast" id="toast"></div>
<input type="file" id="importFileInput" accept=".json,application/json" style="display:none">

<script src="app.js?v=2.0.7"></script>
</body>
</html>
